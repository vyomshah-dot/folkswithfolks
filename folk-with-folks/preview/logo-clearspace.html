<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:#EADDC6;padding:22px;box-sizing:border-box;font-family:'Hanken Grotesk';color:#2A241F;display:flex;gap:28px;align-items:center}
 .frame{position:relative;padding:38px;border:2px dashed #C24E3A;border-radius:10px;background:#F4ECDD}
 .frame img{display:block;width:150px}
 .c{position:absolute;width:38px;height:38px;background:rgba(194,78,58,.15)}
 .tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}
 .txt{max-width:240px}
 .txt b{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
 .txt p{font-size:13px;line-height:1.5;color:rgba(42,36,31,.7);margin:0 0 8px}
</style></head>
<body>
 <div class="frame"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span><img src="../assets/logo-torana-stage.svg" alt="symbol"></div>
 <div class="txt">
  <b>Clear space</b>
  <p>Keep clear space equal to one Warli figure-height on every side.</p>
  <p>Min full lockup: 30 mm / 120 px wide. Don't stretch, rotate, recolour the figures, add gradients, or re-typeset the wordmark.</p>
 </div>
</body></html>
