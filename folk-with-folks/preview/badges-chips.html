<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:#F4ECDD;padding:24px;box-sizing:border-box;font-family:'Hanken Grotesk';color:#2A241F}
 .lab{font-weight:600;font-size:11px;letter-spacing:.16em;color:#7A6F62;margin-bottom:16px}
 .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
 .badge{font-weight:700;font-size:12px;border:2px solid #2A241F;border-radius:999px;padding:5px 12px}
 .chip{font-weight:600;font-size:13px;border:2px solid #2A241F;border-radius:10px;padding:6px 12px;background:#EADDC6}
 .warn{display:inline-flex;gap:7px;align-items:center;background:#7A2E2E;color:#F4ECDD;font-weight:600;font-size:13px;border-radius:10px;padding:7px 12px;margin-top:14px}
</style></head>
<body>
 <div class="lab">BADGES &amp; CHIPS</div>
 <div class="row">
  <span class="badge" style="background:#E8A33D">Ages 7+</span>
  <span class="badge" style="background:#5C7A4A;color:#F4ECDD">New</span>
  <span class="badge" style="background:#C24E3A;color:#F4ECDD">Bestseller</span>
  <span class="chip">Puppetry</span>
  <span class="chip">Stop-motion</span>
  <span class="chip">Folk tales</span>
 </div>
 <div class="warn">⚠ Small parts — a grown-up should help with the snipping.</div>
</body></html>
