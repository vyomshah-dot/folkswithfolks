<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:#F4ECDD;font-family:'Hanken Grotesk',sans-serif;padding:22px;box-sizing:border-box}
 .bar{display:flex;height:64px;border:2px solid #2A241F;border-radius:12px;overflow:hidden}
 .bar>div{display:flex;align-items:center;justify-content:center;color:#F4ECDD;font-size:12px;font-weight:700}
 .legend{display:flex;gap:18px;margin-top:14px;font-size:12.5px;color:#2A241F;flex-wrap:wrap}
 .legend span{display:inline-flex;align-items:center;gap:6px}
 .d{width:12px;height:12px;border-radius:3px;border:1px solid #2A241F}
</style></head>
<body>
 <div class="bar">
  <div style="flex:60;background:#F4ECDD;color:#2A241F">60%</div>
  <div style="flex:20;background:#2A241F">20%</div>
  <div style="flex:12;background:#C24E3A">12%</div>
  <div style="flex:8;background:#2E3A59">8%</div>
 </div>
 <div class="legend">
  <span><i class="d" style="background:#F4ECDD"></i>Paper · ground</span>
  <span><i class="d" style="background:#2A241F"></i>Ink · text & line</span>
  <span><i class="d" style="background:#C24E3A"></i>Terracotta + Marigold · accents</span>
  <span><i class="d" style="background:#2E3A59"></i>Indigo / Neem / Maroon · seasoning</span>
 </div>
</body></html>
