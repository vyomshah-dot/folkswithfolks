<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:#F4ECDD;padding:22px 24px;box-sizing:border-box;font-family:'Hanken Grotesk';color:#2A241F}
 .lab{font-weight:600;font-size:11px;letter-spacing:.16em;color:#7A6F62;margin-bottom:14px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .cell{border:2px solid #2A241F;border-radius:12px;padding:12px 14px;background:#EADDC6}
 .yes{border-color:#5C7A4A}
 .no{border-color:#7A2E2E}
 .h{font-weight:600;font-size:11px;letter-spacing:.1em;margin-bottom:5px}
 .yes .h{color:#5C7A4A}.no .h{color:#7A2E2E}
 .cell p{margin:0;font-size:13.5px;line-height:1.45}
 .no p{text-decoration:line-through;color:rgba(42,36,31,.55)}
</style></head>
<body>
 <div class="lab">VOICE · WARM, CURIOUS, CHEEKY</div>
 <div class="grid">
  <div class="cell yes"><div class="h">✓ SAY THIS</div><p>“Snip here. Yes, right there. Now watch it come alive.”</p></div>
  <div class="cell no"><div class="h">✕ NOT THIS</div><p>“Utilise the enclosed implement to separate components.”</p></div>
  <div class="cell yes"><div class="h">✓ SAY THIS</div><p>“Made a wonky one? Good. Wonky has more personality.”</p></div>
  <div class="cell no"><div class="h">✕ NOT THIS</div><p>“Errors in assembly may affect product quality.”</p></div>
 </div>
</body></html>
