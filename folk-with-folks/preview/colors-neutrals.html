<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:#F4ECDD;background-image:radial-gradient(rgba(42,36,31,.12) .5px,transparent .6px);background-size:9px 9px;font-family:'Hanken Grotesk',sans-serif;padding:20px;box-sizing:border-box}
 .row{display:flex;gap:14px}
 .sw{flex:1;border:2px solid #2A241F;border-radius:12px;overflow:hidden}
 .chip{height:78px}
 .meta{padding:8px 10px;background:#fff0;display:flex;flex-direction:column;gap:1px}
 .nm{font-weight:700;font-size:14px;color:#2A241F}
 .hx{font-size:12px;color:#7A6F62;letter-spacing:.02em}
</style></head>
<body>
 <div class="row">
  <div class="sw"><div class="chip" style="background:#F4ECDD"></div><div class="meta"><span class="nm">Paper</span><span class="hx">#F4ECDD · --paper</span></div></div>
  <div class="sw"><div class="chip" style="background:#EADDC6"></div><div class="meta"><span class="nm">Paper Deep</span><span class="hx">#EADDC6 · --paper-deep</span></div></div>
  <div class="sw"><div class="chip" style="background:#2A241F"></div><div class="meta"><span class="nm">Ink</span><span class="hx">#2A241F · --ink</span></div></div>
 </div>
</body></html>
