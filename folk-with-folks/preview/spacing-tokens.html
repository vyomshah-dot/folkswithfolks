<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:#F4ECDD;padding:22px 24px;box-sizing:border-box;font-family:'Hanken Grotesk';color:#2A241F}
 .lab{font-weight:600;font-size:11px;letter-spacing:.16em;color:#7A6F62;margin-bottom:16px}
 .row{display:flex;align-items:flex-end;gap:14px}
 .item{display:flex;flex-direction:column;align-items:center;gap:7px}
 .bx{background:#E8A33D;border:1px solid #2A241F}
 .t{font-size:11px;color:#7A6F62}
</style></head>
<body>
 <div class="lab">SPACING · 4PX BASE</div>
 <div class="row">
  <div class="item"><div class="bx" style="width:4px;height:32px"></div><span class="t">4</span></div>
  <div class="item"><div class="bx" style="width:8px;height:32px"></div><span class="t">8</span></div>
  <div class="item"><div class="bx" style="width:12px;height:32px"></div><span class="t">12</span></div>
  <div class="item"><div class="bx" style="width:16px;height:32px"></div><span class="t">16</span></div>
  <div class="item"><div class="bx" style="width:24px;height:32px"></div><span class="t">24</span></div>
  <div class="item"><div class="bx" style="width:32px;height:32px"></div><span class="t">32</span></div>
  <div class="item"><div class="bx" style="width:48px;height:32px"></div><span class="t">48</span></div>
  <div class="item"><div class="bx" style="width:64px;height:32px"></div><span class="t">64</span></div>
  <div class="item"><div class="bx" style="width:96px;height:32px"></div><span class="t">96</span></div>
 </div>
</body></html>
