<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:#F4ECDD;padding:26px 24px;box-sizing:border-box;font-family:'Hanken Grotesk';color:#2A241F}
 .lab{font-weight:600;font-size:11px;letter-spacing:.16em;color:#7A6F62;margin-bottom:18px}
 .row{display:flex;gap:34px;align-items:center}
 .c{background:#EADDC6;border:2px solid #2A241F;border-radius:14px;width:150px;height:78px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:15px}
 .s1{box-shadow:3px 3px 0 0 #2A241F}
 .s2{box-shadow:5px 5px 0 0 #2A241F}
 .s3{box-shadow:5px 5px 0 0 #C24E3A}
 .t{font-size:11px;color:#7A6F62;text-align:center;margin-top:10px}
</style></head>
<body>
 <div class="lab">HARD INK SHADOW · NO BLUR</div>
 <div class="row">
  <div><div class="c s1">3px offset</div><div class="t">--shadow-hard-sm</div></div>
  <div><div class="c s2">5px offset</div><div class="t">--shadow-hard (signature)</div></div>
  <div><div class="c s3" style="border-color:#C24E3A">accent</div><div class="t">--shadow-hard-accent</div></div>
 </div>
</body></html>
