37 L87.06,116.11" stroke="#E8A33D" stroke-width="0.42"/><rect x="81" y="116.61" width="6" height="71.81" fill="#C24E3A" /><path d="M82.8,118.61 L82.8,186.7" stroke="#E8A33D" stroke-width="0.72" opacity=".7"/><rect x="79.8" y="188.42" width="8.4" height="2.58" fill="#C24E3A" /><rect x="130.3" y="105" width="11.4" height="3.87" fill="#C24E3A" /><path d="M132.1,108.87 139.9,108.87 141.1,116.61 130.9,116.61 Z" fill="#C24E3A" /><path d="M133.66,109.37 L132.94,116.11" stroke="#E8A33D" stroke-width="0.42"/><path d="M135.22,109.37 L134.98,116.11" stroke="#E8A33D" stroke-width="0.42"/><path d="M136.78,109.37 L137.02,116.11" stroke="#E8A33D" stroke-width="0.42"/><path d="M138.34,109.37 L139.06,116.11" stroke="#E8A33D" stroke-width="0.42"/><rect x="133" y="116.61" width="6" height="71.81" fill="#C24E3A" /><path d="M134.8,118.61 L134.8,186.7" stroke="#E8A33D" stroke-width="0.72" opacity=".7"/><rect x="131.8" y="188.42" width="8.4" height="2.58" fill="#C24E3A" /><rect x="98" y="192" width="24" height="7.5" fill="#2E3A59" /><rect x="108.5" y="87" width="3" height="105" fill="#2A241F" opacity=".25"/><text x="110" y="140" font-family="Hanken Grotesk" font-size="3.4" font-weight="500" fill="#2A241F" text-anchor="middle" >puppet</text><text x="30" y="255" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >Base 320 × 200 × 90 · canopy 130 × 66, 282 tall · total height about 37 cm</text><text x="205" y="52" font-family="Hanken Grotesk" font-size="4.2" font-weight="700" fill="#2A241F" text-anchor="start" >How it goes together · no glue, no scissors</text><circle cx="210" cy="64" r="5" fill="#C24E3A" /><text x="210" y="66" font-family="Bricolage Grotesque" font-size="5" font-weight="800" fill="#F4ECDD" text-anchor="middle" >1</text><text x="219" y="64" font-family="Bricolage Grotesque" font-size="4.4" font-weight="800" fill="#2A241F" text-anchor="start" >Tear the band</text><text x="219" y="70" font-family="Hanken Grotesk" font-size="3.4" font-weight="400" fill="#2A241F" text-anchor="start" >Lift off the folded canopy, window and phone-stand sheet.</text><circle cx="210" cy="81" r="5" fill="#C24E3A" /><text x="210" y="83" font-family="Bricolage Grotesque" font-size="5" font-weight="800" fill="#F4ECDD" text-anchor="middle" >2</text><text x="219" y="81" font-family="Bricolage Grotesque" font-size="4.4" font-weight="800" fill="#2A241F" text-anchor="start" >Pull a wheel</text><text x="219" y="87" font-family="Hanken Grotesk" font-size="3.4" font-weight="400" fill="#2A241F" text-anchor="start" >Each wheel is a drawer. Drawer 1: skeleton + stencils. Drawer 2: clay + cloth.</text><circle cx="210" cy="98" r="5" fill="#C24E3A" /><text x="210" y="100" font-family="Bricolage Grotesque" font-size="5" font-weight="800" fill="#F4ECDD" text-anchor="middle" >3</text><text x="219" y="98" font-family="Bricolage Grotesque" font-size="4.4" font-weight="800" fill="#2A241F" text-anchor="start" >Build Chanakya</text><text x="219" y="104" font-family="Hanken Grotesk" font-size="3.4" font-weight="400" fill="#2A241F" text-anchor="start" >Follow the manual. Stand him on the plinth, pegs up into the foot loops.</text><circle cx="210" cy="115" r="5" fill="#C24E3A" /><text x="210" y="117" font-family="Bricolage Grotesque" font-size="5" font-weight="800" fill="#F4ECDD" text-anchor="middle" >4</text><text x="219" y="115" font-family="Bricolage Grotesque" font-size="4.4" font-weight="800" fill="#2A241F" text-anchor="start" >Pop the canopy</text><text x="219" y="121" font-family="Hanken Grotesk" font-size="3.4" font-weight="400" fill="#2A241F" text-anchor="start" >Open the flat tube, curve the roof band, tuck its tab into the slit.</text><circle cx="210" cy="132" r="5" fill="#C24E3A" /><text x="210" y="134" font-family="Bricolage Grotesque" font-size="5" font-weight="800" fill="#F4ECDD" text-anchor="middle" >5</text><text x="219" y="132" font-family="Bricolage Grotesque" font-size="4.4" font-weight="800" fill="#2A241F" text-anchor="start" >Lock it on</text><text x="219" y="138" font-family="Hanken Grotesk" font-size="3.4" font-weight="400" fill="#2A241F" text-anchor="start" >Fold the inner frame up, side tabs into the slits. Push the 4 floor tabs into the stage.</text><circle cx="210" cy="149" r="5" fill="#C24E3A" /><text x="210" y="151" font-family="Bricolage Grotesque" font-size="5" font-weight="800" fill="#F4ECDD" text-anchor="middle" >6</text><text x="219" y="149" font-family="Bricolage Grotesque" font-size="4.4" font-weight="800" fill="#2A241F" text-anchor="start" >Shoot, then keep</text><text x="219" y="155" font-family="Hanken Grotesk" font-size="3.4" font-weight="400" fill="#2A241F" text-anchor="start" >Slide the window out to film. Slide it back in: the ratha is his display case.</text><text x="205" y="170" font-family="Hanken Grotesk" font-size="4.2" font-weight="700" fill="#2A241F" text-anchor="start" >Pages</text><text x="205" y="177" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >2 · Base tube (stage on top, symbol legend on the back)</text><text x="205" y="182.2" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >3 · Drawers ×2</text><text x="205" y="187.4" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >4 · Wheels, plinth, window</text><text x="205" y="192.6" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >5 · Canopy outside</text><text x="205" y="197.8" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >6 · Canopy inside (backdrop)</text><text x="205" y="203" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >7 · Retail band</text><text x="205" y="208.2" font-family="Hanken Grotesk" font-size="3.6" font-weight="400" fill="#2A241F" text-anchor="start" >8 · Phone stand</text><text x="205" y="222" font-family="Hanken Grotesk" font-size="3.4" font-weight="600" fill="#C24E3A" text-anchor="start" >Not cut or tested yet. Check on the first prototype: slot fit for the real board,</text><text x="205" y="227" font-family="Hanken Grotesk" font-size="3.4" font-weight="600" fill="#C24E3A" text-anchor="start" >roof-band curve, drawer slide, and that the clothed puppet clears the arch.</text><text x="14" y="285" font-family="Hanken Grotesk" font-size="9" font-weight="500" fill="#2A241F" text-anchor="start" >1 · Overview</text><text x="406" y="285" font-family="Hanken Grotesk" font-size="4.2" font-weight="400" fill="#2A241F" text-anchor="end" >Katha 01 · Chanakya ratha · 1:1 · mm · cut <tspan fill='#E4002B'>red</tspan> · fold <tspan fill='#00A651'>green dashed</tspan> · glue <tspan fill='#3B82F6'>blue</tspan></text></svg>