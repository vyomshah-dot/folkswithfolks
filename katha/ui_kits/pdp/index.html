<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chanakya's Kit of Wit — Katha</title>
<style>
  @font-face{font-family:'Bricolage Grotesque';src:url('../../fonts/BricolageGrotesque-VariableFont_opsz_wdth_wght.ttf') format('truetype');font-weight:200 800;font-style:normal;font-display:swap}
  @font-face{font-family:'Fraunces';src:url('../../fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
  @font-face{font-family:'Fraunces';src:url('../../fonts/Fraunces-Italic-VariableFont_SOFT_WONK_opsz_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
  @font-face{font-family:'Hanken Grotesk';src:url('../../fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
  @font-face{font-family:'Hanken Grotesk';src:url('../../fonts/HankenGrotesk-Italic-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
</style>
<style>
  :root{--ink:#2A241F;--paper:#F4ECDD;--paper2:#EADDC6;--card:#FBF6EB;--terra:#C24E3A;--marigold:#E8A33D;--indigo:#2E3A59;--leaf:#5C7A4A;--maroon:#7A2E2E;
    --disp:'Bricolage Grotesque',sans-serif;--serif:'Fraunces',Georgia,serif;--body:'Hanken Grotesk',system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
    background-image:radial-gradient(rgba(42,36,31,.035) 1px,transparent 1px);background-size:22px 22px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:0 28px}
  h1,h2,h3,h4{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.06}
  .h2{font-size:38px}
  a{color:inherit;text-decoration:none}
  i[data-lucide]{width:20px;height:20px;display:inline-block;vertical-align:middle}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--terra);text-transform:uppercase}

  /* buttons (shared with site) */
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:17px;color:var(--ink);background:var(--terra);border:2px solid var(--ink);border-radius:12px;padding:12px 22px;cursor:pointer;transition:transform .12s,background-color .12s}
  .btn i[data-lucide]{width:18px;height:18px}
  .btn-primary:hover{background:#CC5942}.btn-primary:active{background:#A8412F;transform:translate(2px,2px)}
  .btn-ghost{background:transparent}.btn-ghost:hover{background:rgba(42,36,31,.08)}

  /* header/footer (shared) */
  .site-header{position:sticky;top:0;z-index:30;background:rgba(244,236,221,.92);border-bottom:2px solid var(--ink)}
  .header-inner{display:flex;align-items:center;gap:24px;height:74px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-word{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.03em;line-height:1;white-space:nowrap}
  .brand-word em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--terra)}
  .nav-links{display:flex;gap:26px;margin-left:14px}
  .nav-link{font-weight:600;font-size:15px;padding:4px 0;border-bottom:2px solid transparent}
  .nav-link:hover{border-color:var(--terra)}
  .header-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .icon-btn{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:transparent;border:2px solid transparent;border-radius:10px;cursor:pointer;color:var(--ink)}
  .icon-btn:hover{border-color:var(--ink)}
  .cart-badge{position:absolute;top:0;right:0;background:var(--terra);color:#fff;font-weight:700;font-size:11px;min-width:18px;height:18px;border-radius:9px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0 4px}
  .menu-only{display:none}.mobile-menu{display:none}
  .site-footer{background:var(--ink);color:var(--paper2);margin-top:20px}
  .footer-inner{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;padding:48px 0 30px}
  .footer-tag{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--marigold);margin:14px 0}
  .footer-motifs{display:flex;gap:12px}
  .footer-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .footer-col h4{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);margin-bottom:12px;font-family:var(--body);font-weight:700}
  .footer-col a{display:block;font-size:14.5px;color:rgba(244,236,221,.72);padding:4px 0}
  .footer-col a:hover{color:var(--marigold)}
  .footer-base{display:flex;justify-content:space-between;border-top:1px solid rgba(244,236,221,.18);padding:18px 0 30px;font-size:13px;color:rgba(244,236,221,.55)}

  /* breadcrumb */
  .crumb{display:flex;align-items:center;gap:7px;padding:22px 0 6px;font-size:13.5px;color:rgba(42,36,31,.6)}
  .crumb a:hover{color:var(--terra)}
  .crumb i[data-lucide]{width:15px;height:15px;opacity:.5}
  .crumb span{color:var(--ink);font-weight:600}

  /* pdp top */
  .pdp-top{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:14px 0 40px;align-items:start}

  /* gallery */
  .gallery-main{position:relative;background:var(--indigo);border:2px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background-image:radial-gradient(rgba(244,236,221,.06) 1px,transparent 1px);background-size:22px 22px}
  .gallery-tag{position:absolute;top:14px;left:14px;z-index:2;background:var(--paper);border:2px solid var(--ink);border-radius:999px;font-size:12px;font-weight:700;padding:4px 12px;white-space:nowrap}
  .gallery-stage{display:flex;align-items:center;justify-content:center}
  .box-face{background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;width:248px;height:288px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
  .box-line{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--terra)}
  .box-title{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.02em;white-space:nowrap}
  .box-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:rgba(42,36,31,.55)}
  .box-face .char-badge{margin-top:10px}
  .gallery-thumbs{display:flex;gap:12px;margin-top:14px}
  .thumb{width:64px;height:64px;border:2px solid var(--ink);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .thumb.is-active{background:var(--terra)}
  .char-badge{display:flex;align-items:center;justify-content:center;background:var(--marigold);border:2px solid var(--ink);border-radius:50%}

  /* buy panel */
  .pdp-title{font-size:46px;margin:12px 0 0;letter-spacing:-.03em;line-height:1}
  .pdp-lead{font-family:var(--serif);font-size:19px;line-height:1.5;color:rgba(42,36,31,.78);margin:16px 0 0}
  .badge-row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
  .badge{font-weight:700;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:4px 11px}
  .badge-mar{background:var(--marigold)}.badge-leaf{background:var(--leaf);color:var(--paper)}.badge-line{background:transparent}
  .price-row{display:flex;align-items:baseline;gap:14px;margin:22px 0 0}
  .price{font-family:var(--disp);font-weight:800;font-size:38px}
  .price-note{font-size:13px;color:rgba(42,36,31,.6)}
  .buy-actions{display:flex;gap:14px;margin:18px 0 0}
  .qty{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
  .qty button{width:46px;height:48px;border:0;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .qty button:hover{background:var(--paper2)}
  .qty span{min-width:42px;text-align:center;font-weight:700;font-size:18px}
  .buy-btn{flex:1;justify-content:center;font-size:18px}
  .wish{margin:12px 0 0;padding:10px 16px;font-size:15px}
  .ship{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:9px;font-size:14.5px;color:rgba(42,36,31,.72)}
  .ship li{display:flex;align-items:center;gap:10px}
  .ship i[data-lucide]{width:18px;height:18px;color:var(--terra)}

  /* contents accordion */
  .contents{padding:30px 0;border-top:2px solid rgba(42,36,31,.12)}
  .accordion{margin-top:18px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
  .acc-row{border-bottom:2px solid var(--ink)}
  .acc-row:last-child{border-bottom:0}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:0;padding:16px 20px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:19px;color:var(--ink)}
  .acc-row.is-open .acc-head{background:var(--paper2)}
  .acc-body{margin:0;padding:0 20px 16px;font-size:15px;color:rgba(42,36,31,.72)}

  /* build steps */
  .build{padding:36px 0}
  .build-title{text-align:center;margin-bottom:30px}
  .build-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .build-step{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px}
  .build-num{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:2px solid var(--terra);color:var(--terra);border-radius:50%;font-family:var(--disp);font-weight:800;font-size:19px}
  .build-step h4{font-size:19px;margin:12px 0 6px}
  .build-step p{font-size:14.5px;line-height:1.5;color:rgba(42,36,31,.7);margin:0}

  /* reviews */
  .reviews{padding:30px 0 50px;border-top:2px solid rgba(42,36,31,.12)}
  .rev-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
  .rev-stars{color:var(--marigold);font-size:18px;font-weight:700}
  .rev-stars em{font-style:normal;color:rgba(42,36,31,.6);font-size:14px;font-weight:600}
  .rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .rev-card{margin:0;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;box-shadow:4px 4px 0 var(--ink)}
  .rev-card blockquote{margin:12px 0;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.45}
  .rev-card figcaption{font-size:13px;font-weight:600;color:rgba(42,36,31,.6)}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 18px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:4px 4px 0 var(--terra);animation:toastIn .2s ease}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  @media(max-width:900px){.pdp-top{grid-template-columns:1fr}.build-grid,.rev-grid{grid-template-columns:1fr}.footer-inner{grid-template-columns:1fr}.nav-links{display:none}.pdp-title{font-size:36px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="PDP.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
